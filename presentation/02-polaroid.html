<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Le 4 Polaroid</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; min-height: 100vh; font-family: 'Fredoka', sans-serif; background: url('safari_family_real.png') center/cover; }
        
        #stage-2 {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: rgba(0,0,0,0.4);
            padding: 2rem;
        }

        .polaroid {
            background: white;
            padding: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transform: translateY(0) rotate(0deg);
            transition: all 0.3s;
        }
        
        .polaroid:hover {
            transform: scale(1.05) !important;
            z-index: 10;
        }

        #char-1 { transform: rotate(-6deg); }
        #char-2 { transform: rotate(4deg); }
        #char-3 { transform: rotate(-3deg); }
        #char-4 { transform: rotate(7deg); }

    </style>
</head>
<body>

    <div id="stage-2">
        <h1 class="text-6xl text-white font-bold drop-shadow-lg mb-12" style="text-shadow: 3px 3px 6px rgba(0,0,0,0.8);">I 4 Mattacchioni! 🦁</h1>
        <div class="grid grid-cols-2 md:grid-cols-4 gap-8 max-w-7xl mx-auto w-full">
            <div id="char-1" class="polaroid">
                <img src="polaroid/riccardo-pixar.jpg" class="w-full aspect-square object-cover mb-4">
                <h2 class="text-2xl text-center text-gray-800 font-bold">Papà</h2>
            </div>
            <div id="char-2" class="polaroid">
                <img src="polaroid/kate-pixar.jpg" class="w-full aspect-square object-cover mb-4">
                <h2 class="text-2xl text-center text-gray-800 font-bold">Mamma</h2>
            </div>
            <div id="char-3" class="polaroid">
                <img src="polaroid/alessandro-pixar.jpg" class="w-full aspect-square object-cover mb-4">
                <h2 class="text-2xl text-center text-gray-800 font-bold">Ale l'Esploratore</h2>
            </div>
            <div id="char-4" class="polaroid">
                <img src="polaroid/sebastian-pixar.jpg" class="w-full aspect-square object-cover mb-4">
                <h2 class="text-2xl text-center text-gray-800 font-bold">Seby il Ranger</h2>
            </div>
        </div>
    </div>

</body>
</html>
