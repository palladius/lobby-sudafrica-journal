<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sudafrica Presentation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { transition: background 1s ease-out; margin: 0; overflow: hidden; font-family: 'Fredoka', sans-serif; }
        
        #bkg {
            position: absolute;
            inset: 0;
            background: url('family/safari_family_real.png') center/cover;
            z-index: 5;
        }

        #stage-1 {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start; padding-top: 10vh;
            color: white;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.8);
            transition: opacity 0.5s;
            z-index: 10;
        }

        /* STADIO 2: Polaroids animate */
        #stage-2 {
            transition: opacity 1s ease-out;
            position: absolute;
            inset: 0;
            z-index: 20;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end; padding-bottom: 5vh;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s;
        }

        .puff-effect {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle, white 10%, transparent 60%);
            opacity: 0;
            z-index: 25;
            pointer-events: none;
        }

        @keyframes puff {
            0% { opacity: 0; transform: scale(0.5); }
            40% { opacity: 1; transform: scale(1.5); }
            100% { opacity: 0; transform: scale(2.5); }
        }

        .polaroid {
            background: white;
            padding: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            opacity: 0;
            transform: translateY(50px) rotate(0deg);
            transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .show-stage-2 .polaroid { opacity: 1; }
        .show-stage-2 #char-1 { transform: translateY(0) rotate(-6deg); transition-delay: 0.1s; }
        .show-stage-2 #char-2 { transform: translateY(0) rotate(4deg); transition-delay: 0.3s; }
        .show-stage-2 #char-3 { transform: translateY(0) rotate(-3deg); transition-delay: 0.5s; }
        .show-stage-2 #char-4 { transform: translateY(0) rotate(7deg); transition-delay: 0.7s; }

        .hint {
            position: absolute;
            bottom: 20px;
            right: 20px;
            font-size: 1.2rem;
            color: rgba(255, 255, 255, 0.8);
            text-shadow: 1px 1px 2px black;
        }
    
@import url('https://fonts.googleapis.com/css2?family=Caveat:wght@700&display=swap');

  body.slideshow-active {
    background-color: #222;
    margin: 0;
    overflow: hidden;
    width: 100vw;
    height: 100vh;
    font-family: 'Caveat', 'Comic Sans MS', cursive, sans-serif;
  }
  
  #background-text {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    z-index: 0;
    color: #555;
    opacity: 0;
    transition: opacity 2s ease-in;
  }
  
  .main-title {
    font-size: 100px;
    font-weight: bold;
    letter-spacing: 5px;
    margin-bottom: 20px;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
  }
  
  .sub-title {
    font-size: 50px;
  }

  .falling-polaroid {
    background: white;
    padding: 10px 10px 30px 10px;
    box-shadow: 0 10px 20px rgba(0,0,0,0.5);
    position: absolute;
    opacity: 0;
    transform: scale(0.5) rotate(0deg);
    transition: all 1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    max-width: 600px;
    max-height: 650px;
    z-index: 10;
  }
  .falling-polaroid img {
    max-width: 100%;
    max-height: 550px;
    display: block;
    border: 1px solid #ddd;
  }
  .falling-polaroid.show {
    opacity: 1;
  }
    </style>
</head>
<body>

    <div id="bkg"></div>
    <div id="puff" class="puff-effect"></div>

    <!-- STADIO 1: Titolo -->
    <div id="stage-1">
        <h1 style="font-size: 5rem; margin-bottom: 0.5rem; font-weight: bold;">South Africa</h1>
        <h2 style="font-size: 2.5rem; color: #f1f5f9; font-weight: 600;">Feb 2026 - Carlesso Family</h2>
        <div class="hint">Press SPACE</div>
    </div>

    <!-- STADIO 2: Polaroids -->
    <div id="stage-2">
        <h1 class="text-6xl text-white font-bold drop-shadow-lg mb-12" style="text-shadow: 3px 3px 6px rgba(0,0,0,0.8);">The 4 Adventurers in Action! 🦁</h1>
        <div class="grid grid-cols-2 md:grid-cols-4 gap-8 px-8">
            <div id="char-1" class="polaroid">
                <img src="family/riccardo-pixar.jpg" class="w-full aspect-square object-cover mb-4">
                <h2 class="text-2xl text-center text-gray-800 font-bold">Dad</h2>
            </div>
            <div id="char-2" class="polaroid">
                <img src="family/kate-pixar.jpg" class="w-full aspect-square object-cover mb-4">
                <h2 class="text-2xl text-center text-gray-800 font-bold">Mom</h2>
            </div>
            <div id="char-3" class="polaroid">
                <img src="family/alessandro-pixar.jpg" class="w-full aspect-square object-cover mb-4">
                <h2 class="text-2xl text-center text-gray-800 font-bold">Ale the Explorer</h2>
            </div>
            <div id="char-4" class="polaroid">
                <img src="family/sebastian-pixar.jpg" class="w-full aspect-square object-cover mb-4">
                <h2 class="text-2xl text-center text-gray-800 font-bold">Seby the Ranger</h2>
            </div>
        </div>
    </div>

    <script>

        let step = 1;
        
        const images = [
    "polaroid/2026-02-08-kate-giraffe-selfie.png",
    "polaroid/2026-02-09-1750-afternoon-elephant-pixar.jpg",
    "polaroid/2026-02-09-1035-family-valley-of-waves-pixar.png",
    "polaroid/2026-02-09-0957-valley-waves-overlook-pixar.png",
    "polaroid/2026-02-09-0821-waffle-brothers.png",
    "polaroid/2026-02-08-family-sebi-zebra-selfie.png",
    "polaroid/2026-02-08-family-car-selfie.png",
    "polaroid/vista-camps-bay-pixar.png",
    "polaroid/2026-02-07-sebi-cuddling-rhino-pixar.png",
    "polaroid/rhino-and-son-pixar.png",
    "polaroid/sebi_feeding_donkeys_pixar_style_20260210.png",
    "polaroid/seby-pasta-colazione-pixar.png",
    "polaroid/museum-ale-dinosauro-pixar.png",
    "polaroid/lions_nuzzling_pixar_style_20260210.png",
    "polaroid/2026-02-07-rhinos-crossing-pixar.png",
    "polaroid/2026-02-25-11-37-31-bo-kaap-yellow-house-pixar.png",
    "polaroid/peeking_hippo_pixar_style_20260210.png",
    "polaroid/francois_elephant_pixar_style_20260210_v2.png",
    "polaroid/best_kids_elephant_selfie_pixar_style_20260210.png",
    "polaroid/2026-02-25-11-38-56-bo-kaap-green-wall-pixar.png",
    "polaroid/ale_safari_hippos_pixar_style_20260210_v2.png",
    "polaroid/riccardo_kate_lion_selfie_pixar_style_20260210.png",
    "polaroid/kids_watching_elephants_pixar_style_20260210.png",
    "polaroid/zebras-pixar.png",
    "polaroid/2026-02-25-23-00-55-kids-sleeping-pixar.png",
    "polaroid/2026-02-07-ale-zebra-pixar.png"

  ];
        
        let currentIndex = 0;
  let nextTiltLeft = Math.random() > 0.5;
  
  function dropPolaroid() {
    if (currentIndex >= images.length) return;
    
    const imgFile = images[currentIndex];
    const div = document.createElement('div');
    div.className = 'falling-polaroid';
    
    const img = document.createElement('img');
    img.src = imgFile;
    div.appendChild(img);
    
    document.body.appendChild(div);
    
    const maxW = window.innerWidth - 650;
    const maxH = window.innerHeight - 650;
    
    const randX = Math.random() * maxW + 20;
    const randY = Math.random() * maxH + 20;
    
    let randRot;
    if (nextTiltLeft) {
      randRot = -(Math.random() * 25 + 10);
    } else {
      randRot = Math.random() * 25 + 10;
    }
    nextTiltLeft = !nextTiltLeft;
    
    void div.offsetWidth;
    
    setTimeout(() => {
      div.style.left = randX + 'px';
      div.style.top = randY + 'px';
      div.style.transform = `scale(1) rotate(${randRot}deg)`;
      div.classList.add('show');
    }, 50);
    
    currentIndex++;
    setTimeout(dropPolaroid, 1000);
  }
        
        // Listen to BOTH spacebar and click
        function advanceStage() {
            if (step === 1) {
                step = 2;
                
                // Effetto PUFF
                const puff = document.getElementById('puff');
                puff.style.animation = 'puff 1s forwards';
                
                // Transizione a Stage 2
                setTimeout(() => {
                    // Nascondi titoli
                    document.getElementById('stage-1').style.opacity = '0';
                    document.getElementById('stage-1').style.pointerEvents = 'none';
                    
                    // Mostra Polaroids
                    const stage2 = document.getElementById('stage-2');
                    stage2.style.opacity = '1';
                    stage2.style.pointerEvents = 'auto';
                    setTimeout(() => stage2.classList.add('show-stage-2'), 100);
                }, 400);
            } 
            else if (step === 2) {
                step = 3;
                
                // Fade out stage 2 and background
                const stage2 = document.getElementById('stage-2');
                stage2.style.opacity = '0';
                stage2.style.pointerEvents = 'none';
                
                document.getElementById('bkg').style.opacity = '0'; // fade out safari background
                document.getElementById('bkg').style.transition = 'opacity 1s ease-out';
                
                // Switch to dark background
                document.body.style.background = '#222';
                
                document.getElementById('background-text').style.opacity = '1';
                
                setTimeout(() => {
                    stage2.style.display = 'none';
                    dropPolaroid();
                }, 1000);
            }
        }

        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                advanceStage();
            }
        });
        
        document.body.addEventListener('click', () => {
            advanceStage();
        });

    </script>
    <div id="background-text">
  <div class="main-title">Sud Africa 2026</div>
</body>
</html>
